<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1a56a0">
<title>Budget semaine</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="apple-touch-icon" href="icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--blue:#1a56a0;--blue-light:#e8f0fb;--red:#c0392b;--red-light:#fdecea;--orange:#d4720a;--orange-light:#fef3e2;--green:#1e7e4a;--bg:#f2f4f8;--card:#fff;--text:#1a1a2e;--muted:#7a7f9a;--border:rgba(0,0,0,0.08);--radius:18px;--radius-sm:12px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;overflow-x:hidden;}
/* HEADER */
.header{background:var(--blue);padding:env(safe-area-inset-top,12px) 20px 0;color:white;}
.header-top{display:flex;justify-content:space-between;align-items:center;padding:14px 0 16px;}
.header-top h1{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;display:inline-block;flex-shrink:0;}
.sync-dot.off{background:#f44336;}
.sync-dot.loading{background:#FAC775;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
/* STATS STRIP */
.stats-strip{background:var(--card);display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--border);}
.ssi{padding:12px 10px;border-right:1px solid var(--border);}
.ssi:last-child{border-right:none;}
.ssi-l{font-size:10px;color:var(--muted);margin-bottom:3px;}
.ssi-v{font-size:14px;font-weight:700;}
.ssi-v.red{color:var(--red);}
.ssi-v.grn{color:var(--green);}
.ssi-v.ora{color:var(--orange);}
/* ALERTS */
.alert{margin:12px 16px 0;border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;font-weight:500;display:none;}
.alert.show{display:block;}
.alert.warn{background:var(--orange-light);color:var(--orange);}
.alert.danger{background:var(--red-light);color:var(--red);}
/* CONTENT */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));}
.content::-webkit-scrollbar{display:none;}
/* FORM */
.form-card{background:var(--card);margin:12px 16px 0;border-radius:var(--radius);padding:16px;border:1px solid var(--border);}
.form-title{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center;}
.form-title .link{text-transform:none;letter-spacing:0;color:var(--blue);cursor:pointer;font-weight:600;font-size:12px;}
.who-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.seg-btn{padding:9px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;color:var(--muted);text-align:center;transition:all .15s;}
.seg-btn.active{background:var(--blue-light);border-color:var(--blue);color:var(--blue);}
.kind-btn.active.exp{background:var(--red-light);border-color:var(--red);color:var(--red);}
.kind-btn.active.inc{background:#e8f7ee;border-color:var(--green);color:var(--green);}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px;}
.cat-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;font-size:11px;color:var(--muted);font-family:inherit;transition:all .15s;}
.cat-btn .ce{font-size:20px;}
.cat-btn.active{background:var(--blue-light);border-color:var(--blue);color:var(--blue);font-weight:600;}
.inputs-row{display:flex;gap:8px;margin-bottom:12px;align-items:flex-end;}
.input-wrap{flex:1;}
.input-wrap label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;font-weight:500;}
.input-wrap input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);font-family:inherit;font-size:15px;color:var(--text);outline:none;-webkit-appearance:none;}
.input-wrap input:focus{border-color:var(--blue);background:white;}
.input-amount{font-size:18px!important;font-weight:600;}
.fixed-check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;padding-bottom:10px;}
.fixed-check input{width:16px;height:16px;accent-color:var(--orange);}
.btn-add{width:100%;padding:13px;border-radius:var(--radius-sm);border:none;background:var(--blue);color:white;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;}
.btn-add:active{opacity:.85;transform:scale(.98);}
/* FIXED CHIPS */
.fixed-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;border:1.5px solid var(--orange);background:var(--orange-light);color:var(--orange);font-size:12px;font-weight:600;margin:0 6px 6px 0;cursor:pointer;font-family:inherit;}
.fixed-badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:6px;margin-left:4px;background:var(--orange-light);color:var(--orange);}
/* TX LIST */
.tx-section{margin:16px 16px 0;}
.tx-section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.tx-section-head span{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.tx-section-head button{font-size:12px;color:var(--blue);background:none;border:none;cursor:pointer;font-family:inherit;}
.tx-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;}
.day-label{font-size:12px;font-weight:600;color:var(--muted);padding:12px 14px 6px;background:var(--bg);}
.tx-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);}
.tx-item:last-child{border-bottom:none;}
.tx-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.tx-info{flex:1;min-width:0;}
.tx-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.who-badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:6px;margin-left:4px;}
.who-badge.moi{background:#e8f0fb;color:#1a56a0;}
.who-badge.elle{background:#fce8f0;color:#a0195a;}
.tx-right{display:flex;align-items:center;gap:8px;}
.tx-amt{font-size:15px;font-weight:600;color:var(--red);white-space:nowrap;}
.tx-amt.inc{color:var(--green);}
.tx-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:0;}
.empty-msg{text-align:center;padding:28px;color:var(--muted);font-size:14px;}
/* HISTORY */
.hist-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border);}
.hist-item:last-child{border-bottom:none;}
.hist-week{font-size:13px;font-weight:500;}
.hist-dates{font-size:11px;color:var(--muted);margin-top:2px;}
.hist-pct{font-size:11px;color:var(--muted);text-align:right;margin-top:2px;}
/* STATS HEADER */
.stat-big{font-size:34px;font-weight:700;letter-spacing:-1px;color:white;line-height:1;}
.stat-big-sub{font-size:13px;opacity:.7;margin:4px 0 14px;}
.stat-prog-track{height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;margin-bottom:4px;}
.stat-prog-fill{height:100%;border-radius:3px;transition:width .4s;}
.stat-prog-labels{display:flex;justify-content:space-between;font-size:11px;opacity:.65;margin-bottom:16px;}
/* STAT CARDS */
.scard{background:var(--card);border-radius:16px;padding:14px;margin:12px 16px 0;border:1px solid var(--border);}
.scard-title{font-size:13px;font-weight:700;color:#374151;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.scard-hint{font-size:10px;font-weight:400;color:var(--muted);}
/* BARS */
.bars-wrap{display:flex;align-items:flex-end;gap:6px;height:100px;margin-bottom:8px;}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;cursor:pointer;}
.bar-val{font-size:9px;font-weight:600;color:#6b7280;}
.bar{width:100%;border-radius:4px 4px 0 0;min-height:4px;transition:all .2s;}
.bar-lbl{font-size:11px;color:var(--muted);font-weight:500;}
.bar-col.sel .bar{outline:3px solid var(--blue);outline-offset:2px;}
.bar-col.sel .bar-lbl{color:var(--blue);font-weight:700;}
.divider-line{border-top:1.5px dashed #e5e7eb;padding-top:6px;display:flex;justify-content:space-between;}
.divider-line span{font-size:10px;color:var(--muted);}
/* DETAIL PANEL */
.detail-panel{border-radius:14px;padding:14px;margin:0 16px;animation:fadeIn .2s ease;}
.detail-panel.month{background:#faf5ff;border:1.5px solid #e9d5ff;margin-top:10px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.dp-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.dp-title{font-size:15px;font-weight:700;}
.dp-title.month{color:#6b21a8;}
.dp-dates{font-size:11px;margin-top:2px;}
.dp-dates.month{color:#9333ea;}
.dp-badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.dp-badge.ok{background:#dcfce7;color:#15803d;}
.dp-badge.over{background:#fee2e2;color:#dc2626;}
.dp-badge.mcur{background:#f3e8ff;color:#7e22ce;}
/* MINI DONUT */
.dp-chart{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.mini-donut{position:relative;flex-shrink:0;}
.mini-donut svg{transform:rotate(-90deg);}
.mini-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.mc-v{font-size:11px;font-weight:700;}
.mc-v.month{color:#6b21a8;}
.mc-l{font-size:8px;color:var(--muted);}
.mini-legend{flex:1;display:flex;flex-direction:column;gap:5px;}
.ml-item{display:flex;align-items:center;gap:6px;}
.ml-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ml-name{font-size:11px;color:#374151;flex:1;}
.ml-val{font-size:11px;font-weight:700;color:var(--text);}
/* COLLAPSIBLE TX */
.dep-section{border-top:1px solid #e9d5ff;padding-top:10px;}
.dep-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:2px 0;}
.dep-left{display:flex;align-items:center;gap:6px;}
.dep-title{font-size:12px;font-weight:700;color:#6b21a8;}
.dep-count{font-size:11px;padding:2px 8px;border-radius:10px;background:#f3e8ff;color:#7e22ce;}
.dep-arrow{font-size:13px;transition:transform .25s;line-height:1;color:#9333ea;}
.dep-arrow.open{transform:rotate(180deg);}
.dep-list{overflow:hidden;max-height:0;transition:max-height .35s ease;}
.dep-list.open{max-height:1000px;}
.dep-list-inner{padding-top:8px;}
.day-lbl-small{font-size:10px;font-weight:700;color:#c084fc;text-transform:uppercase;letter-spacing:.3px;padding:5px 0 3px;}
.dp-tx-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #e9d5ff;}
.dp-tx-item:last-child{border-bottom:none;}
.dp-tx-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.dp-tx-info{flex:1;min-width:0;}
.dp-tx-name{font-size:12px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dp-tx-sub{font-size:10px;color:#6b7280;margin-top:1px;}
.dp-tx-amt{font-size:13px;font-weight:700;white-space:nowrap;}
.dep-total-row{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1.5px solid #e9d5ff;margin-top:4px;}
.dt-label{font-size:12px;color:#6b7280;}
.dt-val{font-size:14px;font-weight:700;}
/* DONUT MAIN */
.donut-wrap{display:flex;align-items:center;gap:16px;}
.donut{position:relative;width:110px;height:110px;flex-shrink:0;}
.donut svg{transform:rotate(-90deg);}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.dc-v{font-size:13px;font-weight:700;color:var(--text);}
.dc-l{font-size:10px;color:var(--muted);}
.legend{display:flex;flex-direction:column;gap:8px;flex:1;}
.leg{display:flex;align-items:center;gap:8px;}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.leg-name{font-size:12px;color:#374151;flex:1;}
.leg-right{text-align:right;}
.leg-val{font-size:12px;font-weight:700;color:var(--text);display:block;}
.leg-pct{font-size:10px;color:var(--muted);}
/* EXPORT */
.export-btn{display:flex;align-items:center;gap:12px;background:#16a34a;border-radius:14px;padding:14px 16px;color:white;cursor:pointer;}
.eb-ico{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.eb-info{flex:1;}
.eb-title{font-size:14px;font-weight:700;}
.eb-sub{font-size:11px;opacity:.8;margin-top:1px;}
.eb-arrow{font-size:18px;opacity:.8;}
/* TABS */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:100;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 12px;cursor:pointer;gap:3px;border:none;background:none;font-family:inherit;}
.tab-icon{font-size:22px;}
.tab-label{font-size:10px;color:var(--muted);font-weight:500;}
.tab.active .tab-label{color:var(--blue);font-weight:700;}
.screen{display:none;}
.screen.active{display:block;}
/* SETUP */
.setup-wrap{display:flex;flex:1;align-items:center;justify-content:center;min-height:100dvh;background:var(--bg);}
.setup-box{padding:32px 24px;text-align:center;max-width:360px;width:100%;}
.setup-box h2{font-size:22px;font-weight:600;margin-bottom:8px;}
.setup-box p{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.6;}
.setup-box input{width:100%;padding:14px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:white;font-family:inherit;font-size:18px;font-weight:500;text-align:center;outline:none;margin-bottom:16px;}
.setup-box input:focus{border-color:var(--blue);}
.setup-box button{width:100%;padding:14px;border-radius:var(--radius-sm);border:none;background:var(--blue);color:white;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--card);border-radius:var(--radius);padding:20px;max-width:380px;width:100%;max-height:80vh;overflow-y:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-head h3{font-size:16px;font-weight:700;}
.modal-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;}
.modal-box .tx-item{padding:10px 0;}
</style>
</head>
<body>

<div id="setup-screen" style="display:none;">
  <div class="setup-wrap">
    <div class="setup-box">
      <div style="font-size:48px;margin-bottom:16px;">👋</div>
      <h2>Bienvenue !</h2>
      <p>Première ouverture de l'app.<br>Comment tu t'appelles ?</p>
      <input type="text" id="setup-name" placeholder="Ton prénom" autocomplete="off" maxlength="20"/>
      <button onclick="saveName()">Commencer</button>
    </div>
  </div>
</div>

<div id="app" style="display:none;flex-direction:column;flex:1;min-height:100dvh;">

  <div class="header">
    <div class="header-top">
      <h1 id="header-title">Budget semaine <span class="sync-dot loading" id="sync-dot"></span></h1>
      <span style="font-size:12px;opacity:.75;cursor:pointer;text-decoration:underline dotted;" id="user-name-label" onclick="editName()"></span>
    </div>
    <div id="header-extra"></div>
  </div>

  <div class="stats-strip" id="stats-strip">
    <div class="ssi"><div class="ssi-l" id="sl1">Dépensé</div><div class="ssi-v red" id="sv1">0</div></div>
    <div class="ssi"><div class="ssi-l" id="sl2">Reste</div><div class="ssi-v grn" id="sv2">0</div></div>
    <div class="ssi"><div class="ssi-l" id="sl3">Revenus</div><div class="ssi-v" id="sv3">0</div></div>
  </div>

  <div class="content">

    <!-- ── BUDGET SCREEN ── -->
    <div class="screen active" id="screen-home">
      <div class="alert" id="alert-box"></div>

      <div class="form-card" id="fixed-quickadd-card" style="display:none;">
        <div class="form-title">Charges fixes à ajouter</div>
        <div id="fixed-chips"></div>
      </div>

      <div class="form-card">
        <div class="form-title">Nouvelle opération <span class="link" onclick="openFixedManager()">⚙ Charges fixes</span></div>
        <div class="who-row">
          <button class="seg-btn kind-btn active exp" data-kind="exp" onclick="pickKind('exp',this)">➖ Dépense</button>
          <button class="seg-btn kind-btn" data-kind="inc" onclick="pickKind('inc',this)">➕ Revenu</button>
        </div>
        <div class="who-row">
          <button class="seg-btn who-btn active" onclick="pickWho('moi',this)">👤 Moi</button>
          <button class="seg-btn who-btn" onclick="pickWho('elle',this)">👤 <span id="partner-label">Ma femme</span></button>
        </div>
        <div class="cat-grid" id="cat-grid"></div>
        <div class="inputs-row">
          <div class="input-wrap" style="flex:2"><label>Description</label><input type="text" id="f-desc" placeholder="ex. Carrefour" autocomplete="off"/></div>
          <div class="input-wrap" style="flex:1.2"><label>Montant FCFP</label><input type="number" id="f-amount" class="input-amount" placeholder="0" inputmode="numeric" min="0"/></div>
        </div>
        <div class="inputs-row">
          <div class="input-wrap"><label>Date</label><input type="date" id="f-date"/></div>
          <label class="fixed-check"><input type="checkbox" id="f-fixed"/> Charge fixe</label>
        </div>
        <button class="btn-add" onclick="addTx()">+ Enregistrer</button>
      </div>
      <div class="tx-section">
        <div class="tx-section-head"><span id="month-section-label">Ce mois-ci</span><button onclick="clearMonth()">Tout effacer</button></div>
        <div class="tx-card" id="tx-list"></div>
      </div>
    </div>

    <!-- ── STATS SCREEN ── -->
    <div class="screen" id="screen-stats">
      <div id="stats-content"></div>
    </div>

    <!-- ── HISTORY SCREEN ── -->
    <div class="screen" id="screen-hist">
      <div class="tx-section" style="margin-top:16px;">
        <div class="tx-section-head"><span>Mois passés</span></div>
        <div class="hist-card" id="hist-list"></div>
      </div>
    </div>

  </div>

  <div class="tab-bar">
    <button class="tab active" id="tab-home" onclick="switchTab('home')"><span class="tab-icon">📊</span><span class="tab-label">Budget</span></button>
    <button class="tab" id="tab-stats" onclick="switchTab('stats')"><span class="tab-icon">📈</span><span class="tab-label">Stats</span></button>
    <button class="tab" id="tab-hist" onclick="switchTab('hist')"><span class="tab-icon">📅</span><span class="tab-label">Historique</span></button>
  </div>
</div>

<!-- ── FIXED TEMPLATES MODAL ── -->
<div class="modal-overlay" id="fixed-modal" onclick="if(event.target===this)closeFixedManager()">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Charges fixes</h3>
      <button class="modal-close" onclick="closeFixedManager()">×</button>
    </div>
    <div class="inputs-row">
      <div class="input-wrap" style="flex:2"><label>Nom</label><input type="text" id="ft-label" placeholder="ex. Loyer" autocomplete="off"/></div>
      <div class="input-wrap" style="flex:1.2"><label>Montant</label><input type="number" id="ft-amount" placeholder="0" inputmode="numeric" min="0"/></div>
    </div>
    <button class="btn-add" style="margin-bottom:16px;" onclick="addFixedTemplate()">+ Ajouter au modèle</button>
    <div id="fixed-tmpl-list"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const CATS = [
  {name:'Courses',    icon:'🛒', bg:'#e8f0fb'},
  {name:'Voiture',   icon:'🚗', bg:'#fef3e2'},
  {name:'Restaurant',icon:'🍽️', bg:'#f0eeff'},
  {name:'Loisirs',   icon:'🎉', bg:'#e8f7ee'},
  {name:'Santé',     icon:'💊', bg:'#fdecea'},
  {name:'Vêtements', icon:'👗', bg:'#fce8f0'},
  {name:'Maison',    icon:'🏠', bg:'#edf7e8'},
  {name:'Retrait',   icon:'💵', bg:'#f2f4f8'},
];
const CAT_COLORS = ['#1a56a0','#FAC775','#a78bfa','#34d399','#f87171','#f9a8d4','#6ee7b7','#94a3b8'];
const DAYS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MONTHS_SHORT = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];

firebase.initializeApp({
  apiKey:"AIzaSyCuDE-XpbpTQX7lVBWrwe3Ljr5GLeeCwBg",
  authDomain:"budget-semaine-5e6a0.firebaseapp.com",
  databaseURL:"https://budget-semaine-5e6a0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"budget-semaine-5e6a0",
  storageBucket:"budget-semaine-5e6a0.firebasestorage.app",
  messagingSenderId:"450955927135",
  appId:"1:450955927135:web:83e1e215a1a7d0522c45ea"
});
const db = firebase.database();

let selCat = CATS[0].name;
let selWho = 'moi';
let selKind = 'exp';
let selFixed = false;
let pendingTmplId = null;
let months = {};
let fixedTemplates = {};
let myName = localStorage.getItem('myName') || '';
let partnerName = localStorage.getItem('partnerName') || 'Ma femme';
let selMonthBar = null;
let openDepMonth = false;

// ─── UTILS ───────────────────────────────────────────────────
function fmt(n){return Math.round(n).toLocaleString('fr-FR')+' FCFP';}
function fmtS(n){return Math.round(n).toLocaleString('fr-FR');}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function localDateStr(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}
function isoToday(){const now=new Date();return localDateStr(new Date(now.getFullYear(),now.getMonth(),now.getDate()));}
function ymKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function curMonthKey(){return ymKey(new Date());}
function monthLabel(key){const [y,m]=key.split('-');return MONTHS_FR[parseInt(m)-1]+' '+y;}

// ─── SETUP ───────────────────────────────────────────────────
function init(){if(!myName){document.getElementById('setup-screen').style.display='block';}else{startApp();}}
function saveName(){const val=document.getElementById('setup-name').value.trim();if(!val)return;myName=val;localStorage.setItem('myName',myName);document.getElementById('setup-screen').style.display='none';startApp();}
function startApp(){
  document.getElementById('app').style.display='flex';
  document.getElementById('user-name-label').textContent=myName;
  document.getElementById('partner-label').textContent=partnerName;
  buildCatGrid();
  subscribeFirebase();
  purgeOld();
}
function editName(){const n=prompt('Modifier ton prénom :',myName);if(n&&n.trim()){myName=n.trim();localStorage.setItem('myName',myName);document.getElementById('user-name-label').textContent=myName+' ✏️';setTimeout(()=>document.getElementById('user-name-label').textContent=myName,2000);}}

// ─── FIREBASE ────────────────────────────────────────────────
function setSyncDot(s){const d=document.getElementById('sync-dot');if(d)d.className='sync-dot'+(s==='ok'?'':s==='off'?' off':' loading');}
function syncClass(){const d=document.getElementById('sync-dot');const c=d?d.className:'';return c.includes('loading')?'loading':c.includes('off')?'off':'';}

function subscribeFirebase(){
  setSyncDot('loading');
  db.ref('months').on('value',snap=>{
    months=snap.val()||{};
    setSyncDot('ok');
    refreshActive();
  },()=>setSyncDot('off'));
  db.ref('fixedTemplates').on('value',snap=>{
    fixedTemplates=snap.val()||{};
    renderFixedChips();
    if(document.getElementById('fixed-modal').style.display==='flex')renderFixedManager();
  },()=>{});
}

function refreshActive(){
  if(document.getElementById('tab-home').classList.contains('active'))render();
  else if(document.getElementById('tab-stats').classList.contains('active'))renderStats();
  else if(document.getElementById('tab-hist').classList.contains('active'))renderHistory();
}

// ─── LEDGER (running balance) ─────────────────────────────────
function computeLedger(key){
  const m=months[key]||{};
  const hasStart=m.start!=null;
  const start=hasStart?Number(m.start):0;
  const entries=Object.values(m.entries||{});
  const sorted=[...entries].sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id)));
  let running=start,totalExp=0,totalInc=0;
  const list=sorted.map(t=>{
    const amt=Number(t.amount);
    if(t.kind==='inc'){running+=amt;totalInc+=amt;}else{running-=amt;totalExp+=amt;}
    return {...t,runningAfter:running};
  });
  return {start,hasStart,list,end:running,totalExp,totalInc};
}

function suggestedStart(key){
  const [y,m]=key.split('-').map(Number);
  const prevKey=ymKey(new Date(y,m-2,1));
  return months[prevKey]?computeLedger(prevKey).end:0;
}

function editStart(){
  const key=curMonthKey();
  const cur=months[key]&&months[key].start!=null?months[key].start:suggestedStart(key);
  const val=prompt('Montant de départ ("Reste") pour '+monthLabel(key)+' :',fmtS(cur));
  if(val===null)return;
  const num=parseFloat(String(val).replace(/[^\d.-]/g,''));
  if(isNaN(num))return;
  setSyncDot('loading');
  db.ref('months/'+key+'/start').set(num).then(()=>setSyncDot('ok')).catch(()=>setSyncDot('off'));
}

function addTx(){
  const amount=parseFloat(document.getElementById('f-amount').value);
  if(!amount||amount<=0){document.getElementById('f-amount').focus();return;}
  const key=curMonthKey();
  const desc=document.getElementById('f-desc').value.trim();
  const id=Date.now().toString();
  const who=selWho==='moi'?myName:partnerName;
  const dateVal=document.getElementById('f-date').value||isoToday();
  const entry={id,desc,amount,cat:selCat,who,date:dateVal,kind:selKind,fixed:selFixed};
  if(pendingTmplId)entry.tmplId=pendingTmplId;
  setSyncDot('loading');
  db.ref('months/'+key+'/entries/'+id).set(entry)
    .then(()=>{
      document.getElementById('f-amount').value='';
      document.getElementById('f-desc').value='';
      document.getElementById('f-date').value=isoToday();
      document.getElementById('f-fixed').checked=false;
      selFixed=false;pendingTmplId=null;
      setSyncDot('ok');
    })
    .catch(()=>setSyncDot('off'));
}

function delTx(id){const key=curMonthKey();setSyncDot('loading');db.ref('months/'+key+'/entries/'+id).remove().then(()=>setSyncDot('ok')).catch(()=>setSyncDot('off'));}
function clearMonth(){
  const key=curMonthKey();
  if(!months[key]||!Object.keys(months[key].entries||{}).length)return;
  if(!confirm('Effacer toutes les opérations de ce mois ?'))return;
  setSyncDot('loading');db.ref('months/'+key+'/entries').remove().then(()=>setSyncDot('ok')).catch(()=>setSyncDot('off'));
}
function purgeOld(){
  const cutoff=new Date();cutoff.setMonth(cutoff.getMonth()-6);
  const cutKey=ymKey(cutoff);
  db.ref('months').once('value',snap=>{const all=snap.val()||{};Object.keys(all).forEach(k=>{if(k<cutKey)db.ref('months/'+k).remove();});});
}

// ─── FIXED TEMPLATES ───────────────────────────────────────────
function openFixedManager(){renderFixedManager();document.getElementById('fixed-modal').style.display='flex';}
function closeFixedManager(){document.getElementById('fixed-modal').style.display='none';}
function renderFixedManager(){
  const list=Object.values(fixedTemplates).sort((a,b)=>a.label.localeCompare(b.label));
  document.getElementById('fixed-tmpl-list').innerHTML=list.length?list.map(t=>`
    <div class="tx-item">
      <div class="tx-info"><div class="tx-name">${esc(t.label)}</div><div class="tx-meta">${fmtS(t.amount)} FCFP</div></div>
      <div class="tx-right"><button class="tx-del" onclick="delFixedTemplate('${t.id}')">×</button></div>
    </div>`).join(''):'<div class="empty-msg">Aucune charge fixe enregistrée.</div>';
}
function addFixedTemplate(){
  const label=document.getElementById('ft-label').value.trim();
  const amount=parseFloat(document.getElementById('ft-amount').value);
  if(!label||!amount||amount<=0)return;
  const id=Date.now().toString();
  setSyncDot('loading');
  db.ref('fixedTemplates/'+id).set({id,label,amount})
    .then(()=>{document.getElementById('ft-label').value='';document.getElementById('ft-amount').value='';setSyncDot('ok');})
    .catch(()=>setSyncDot('off'));
}
function delFixedTemplate(id){
  if(!confirm('Supprimer cette charge fixe du modèle ?'))return;
  setSyncDot('loading');
  db.ref('fixedTemplates/'+id).remove().then(()=>setSyncDot('ok')).catch(()=>setSyncDot('off'));
}
function renderFixedChips(){
  const key=curMonthKey();
  const entries=Object.values((months[key]&&months[key].entries)||{});
  const usedIds=new Set(entries.filter(e=>e.tmplId).map(e=>e.tmplId));
  const pending=Object.values(fixedTemplates).filter(t=>!usedIds.has(t.id));
  const card=document.getElementById('fixed-quickadd-card');
  if(!pending.length){card.style.display='none';return;}
  card.style.display='block';
  document.getElementById('fixed-chips').innerHTML=pending.map(t=>
    `<button class="fixed-chip" onclick="pickFixedTemplate('${t.id}')">🟠 ${esc(t.label)} <b>${fmtS(t.amount)}</b></button>`
  ).join('');
}
function pickFixedTemplate(id){
  const t=fixedTemplates[id];
  if(!t)return;
  pickKind('exp',document.querySelector('.kind-btn[data-kind="exp"]'));
  document.getElementById('f-desc').value=t.label;
  document.getElementById('f-amount').value=t.amount;
  document.getElementById('f-fixed').checked=true;
  selFixed=true;
  pendingTmplId=id;
  document.getElementById('f-amount').scrollIntoView({behavior:'smooth',block:'center'});
  document.getElementById('f-amount').focus();
}

// ─── HOME RENDER ─────────────────────────────────────────────
function buildCatGrid(){document.getElementById('cat-grid').innerHTML=CATS.map(c=>`<button class="cat-btn${c.name===selCat?' active':''}" onclick="pickCat('${c.name}',this)"><span class="ce">${c.icon}</span><span>${c.name}</span></button>`).join('');}
function pickCat(name,el){selCat=name;document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function pickWho(who,el){selWho=who;document.querySelectorAll('.who-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function pickKind(kind,el){selKind=kind;document.querySelectorAll('.kind-btn').forEach(b=>b.classList.remove('active','exp','inc'));el.classList.add('active',kind);}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='f-fixed')selFixed=e.target.checked;});

function render(){
  const key=curMonthKey();
  const led=computeLedger(key);
  const remain=led.end;
  const pct=led.start>0?Math.min(Math.round(led.totalExp/led.start*100),100):0;

  document.getElementById('sl1').textContent='Dépensé';
  document.getElementById('sl2').textContent='Reste';
  document.getElementById('sl3').textContent='Revenus';
  document.getElementById('sv1').textContent=fmtS(led.totalExp);
  document.getElementById('sv2').textContent=fmtS(remain);
  document.getElementById('sv2').className='ssi-v '+(remain<0?'red':'grn');
  document.getElementById('sv3').textContent=fmtS(led.totalInc);

  document.getElementById('header-extra').innerHTML=`
    <div style="padding-bottom:20px;">
      <div style="font-size:12px;opacity:.75;margin-bottom:2px;">${monthLabel(key)}</div>
      <div style="font-size:12px;opacity:.75;margin-bottom:4px;cursor:pointer;text-decoration:underline dotted;" onclick="editStart()">Reste (appuie pour modifier)</div>
      <div style="font-size:38px;font-weight:700;letter-spacing:-1px;color:${remain<0?'#FAC775':'white'};line-height:1;margin-bottom:6px;">${remain>=0?fmt(remain):'- '+fmt(Math.abs(remain))}</div>
      <div style="font-size:12px;opacity:.75;margin-bottom:14px;">Départ ${fmt(led.start)} · ${fmt(led.totalExp)} dépensé${led.totalInc?' · '+fmt(led.totalInc)+' reçu':''}</div>
      <div style="background:rgba(255,255,255,.2);border-radius:6px;height:7px;overflow:hidden;margin-bottom:5px;">
        <div style="height:100%;width:${pct}%;border-radius:6px;background:${pct>=100?'#F09595':pct>=80?'#FAC775':'white'};transition:width .5s;"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;opacity:.7;">
        <span>${pct}% du départ utilisé</span><span>${fmt(led.start)}</span>
      </div>
    </div>`;

  const ab=document.getElementById('alert-box');
  if(!led.hasStart){ab.className='alert show warn';ab.innerHTML='⚠️ Montant de départ non défini pour ce mois — <span style="text-decoration:underline;cursor:pointer;" onclick="editStart()">le définir</span>.';}
  else if(remain<0){ab.className='alert show danger';ab.textContent='⚠️ Solde négatif de '+fmt(Math.abs(remain))+' !';}
  else if(pct>=80){ab.className='alert show warn';ab.textContent='⚠️ '+pct+'% du départ utilisé — il reste '+fmt(remain)+'.';}
  else{ab.className='alert';}

  document.getElementById('month-section-label').textContent=monthLabel(key);
  renderFixedChips();
  renderList(led.list);
}

function renderList(list){
  const el=document.getElementById('tx-list');
  if(!list.length){el.innerHTML='<div class="empty-msg">Aucune opération ce mois-ci 🎉</div>';return;}
  const sorted=[...list].sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
  const grouped={};
  sorted.forEach(t=>{if(!grouped[t.date])grouped[t.date]=[];grouped[t.date].push(t);});
  el.innerHTML=Object.entries(grouped).map(([date,items])=>{
    const d=new Date(date+'T12:00:00');
    const dayNet=items.reduce((s,t)=>s+(t.kind==='inc'?Number(t.amount):-Number(t.amount)),0);
    const hdr=`<div class="day-label">${DAYS[d.getDay()]} ${d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} — ${dayNet>=0?'+':''}${fmt(dayNet)}</div>`;
    const rows=items.map(t=>{
      const cat=CATS.find(c=>c.name===t.cat)||CATS[7];
      const isMe=t.who===myName;
      const isInc=t.kind==='inc';
      return `<div class="tx-item">
        <div class="tx-ico" style="background:${cat.bg}">${cat.icon}</div>
        <div class="tx-info"><div class="tx-name">${esc(t.desc||t.cat)}${t.fixed?' <span class="fixed-badge">Fixe</span>':''}</div><div class="tx-meta">${esc(t.cat)} <span class="who-badge ${isMe?'moi':'elle'}">${esc(t.who)}</span> · reste ${fmtS(t.runningAfter)}</div></div>
        <div class="tx-right"><div class="tx-amt ${isInc?'inc':''}">${isInc?'+':'-'}${fmt(Number(t.amount))}</div><button class="tx-del" onclick="delTx('${t.id}')">×</button></div>
      </div>`;
    }).join('');
    return hdr+rows;
  }).join('');
}

// ─── STATS ───────────────────────────────────────────────────
function renderStats(){
  const keys=Object.keys(months).sort();
  let monthsList=keys.map(k=>{
    const led=computeLedger(k);
    return {key:k,list:led.list,spent:led.totalExp,inc:led.totalInc,start:led.start,end:led.end};
  });
  const curKey=curMonthKey();
  let curMonth=monthsList.find(m=>m.key===curKey);
  if(!curMonth){
    const led=computeLedger(curKey);
    curMonth={key:curKey,list:led.list,spent:led.totalExp,inc:led.totalInc,start:led.start,end:led.end};
    monthsList.push(curMonth);
    monthsList.sort((a,b)=>a.key.localeCompare(b.key));
  }

  const total=curMonth.spent;
  const expList=curMonth.list.filter(t=>t.kind!=='inc');
  const fixedTotal=expList.filter(t=>t.fixed).reduce((s,t)=>s+Number(t.amount),0);
  const varTotal=total-fixedTotal;
  const cats=buildCatStats(expList);
  const mName=monthLabel(curMonth.key);
  const pct=curMonth.start>0?Math.min(Math.round(total/curMonth.start*100),100):0;

  document.getElementById('header-title').innerHTML='Statistiques <span class="sync-dot '+syncClass()+'" id="sync-dot"></span>';
  document.getElementById('header-extra').innerHTML=`
    <div class="stat-big">${fmt(total)}</div>
    <div class="stat-big-sub">${mName} · ${curMonth.list.length} opérations</div>
    <div class="stat-prog-track"><div class="stat-prog-fill" style="width:${pct}%;background:#FAC775;"></div></div>
    <div class="stat-prog-labels"><span>${pct}% du départ (${fmt(curMonth.start)})</span><span>Fixe ${fmt(fixedTotal)} · Var ${fmt(varTotal)}</span></div>`;
  document.getElementById('sl1').textContent='Dépensé';document.getElementById('sv1').textContent=fmtS(total);document.getElementById('sv1').className='ssi-v red';
  document.getElementById('sl2').textContent='Reste';document.getElementById('sv2').textContent=fmtS(curMonth.end);document.getElementById('sv2').className='ssi-v '+(curMonth.end<0?'red':'grn');
  document.getElementById('sl3').textContent='Revenus';document.getElementById('sv3').textContent=fmtS(curMonth.inc);document.getElementById('sv3').className='ssi-v';

  const maxM=Math.max(...monthsList.map(m=>m.spent),1);
  const bars=monthsList.map((m,i)=>{
    const h=Math.max(8,Math.round((m.spent/maxM)*85));
    const isCur=m.key===curMonth.key;
    const color=isCur?'#7c3aed':'#c4b5fd';
    const lbl=MONTHS_SHORT[parseInt(m.key.split('-')[1])-1];
    return `<div class="bar-col${selMonthBar===i?' sel':''}" onclick="clickMonthBar(${i})">
      <div class="bar-val">${Math.round(m.spent/1000)}k</div>
      <div class="bar" style="height:${h}px;background:${color};"></div>
      <div class="bar-lbl">${lbl}</div>
    </div>`;
  }).join('');

  const donutSvg=buildDonutSvg(cats,110);

  document.getElementById('stats-content').innerHTML=`
    <div class="scard">
      <div class="scard-title">Mois <span class="scard-hint">appuie pour le détail</span></div>
      <div class="bars-wrap">${bars}</div>
      <div class="divider-line"><span>Moy: ${fmt(Math.round(monthsList.reduce((s,m)=>s+m.spent,0)/Math.max(monthsList.length,1)))}</span><span>${monthsList.length} mois</span></div>
    </div>
    <div id="month-detail-panel"></div>
    <div class="scard">
      <div class="scard-title">Par catégorie <span class="scard-hint">mois en cours</span></div>
      <div class="donut-wrap">
        <div class="donut">${donutSvg}<div class="donut-center"><div class="dc-v">${fmtS(total)}</div><div class="dc-l">FCFP</div></div></div>
        <div class="legend">${cats.map((c,i)=>`<div class="leg"><div class="leg-dot" style="background:${CAT_COLORS[i%CAT_COLORS.length]}"></div><div class="leg-name">${esc(c.name)}</div><div class="leg-right"><span class="leg-val">${fmtS(c.val)}</span><span class="leg-pct">${c.pct}%</span></div></div>`).join('')}</div>
      </div>
    </div>
    <div class="scard">
      <div class="scard-title">Export</div>
      <div class="export-btn" onclick="exportExcel()">
        <div class="eb-ico">📊</div>
        <div class="eb-info"><div class="eb-title">Exporter en Excel</div><div class="eb-sub">${mName}</div></div>
        <div class="eb-arrow">↓</div>
      </div>
    </div>`;

  window._statsMonths=monthsList;
}

function buildCatStats(list){
  const total=list.reduce((s,t)=>s+Number(t.amount),0)||1;
  const map={};
  list.forEach(t=>{map[t.cat]=(map[t.cat]||0)+Number(t.amount);});
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([name,val])=>({name,val,pct:Math.round(val/total*100)}));
}

function buildDonutSvg(cats,size){
  const cx=size/2,cy=size/2,r=size*0.36,sw=size*0.13,circ=2*Math.PI*r;
  let off=-circ*0.25;
  const total=cats.reduce((s,c)=>s+c.val,0)||1;
  const arcs=cats.map((c,i)=>{
    const d=(c.val/total)*circ;
    const a=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${CAT_COLORS[i%CAT_COLORS.length]}" stroke-width="${sw}" stroke-dasharray="${d.toFixed(1)} ${(circ-d).toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>`;
    off-=d;return a;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="${sw}"/>${arcs}</svg>`;
}

function buildMiniDonut(cats,size,type){
  const cx=size/2,cy=size/2,r=size*0.37,sw=size*0.13,circ=2*Math.PI*r;
  let off=-circ*0.25;
  const total=cats.reduce((s,c)=>s+c.val,0)||1;
  const arcs=cats.map((c,i)=>{
    const d=(c.val/total)*circ;
    const a=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${CAT_COLORS[i%CAT_COLORS.length]}" stroke-width="${sw}" stroke-dasharray="${d.toFixed(1)} ${(circ-d).toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>`;
    off-=d;return a;
  }).join('');
  return `<div class="mini-donut" style="width:${size}px;height:${size}px;"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="${sw}"/>${arcs}</svg><div class="mini-center"><div class="mc-v ${type}">${fmtS(cats.reduce((s,c)=>s+c.val,0))}</div><div class="mc-l">FCFP</div></div></div>`;
}

function renderTxList(list){
  if(!list.length)return '<div style="font-size:12px;color:#9ca3af;padding:8px 0;">Aucune opération</div>';
  const sorted=[...list].sort((a,b)=>b.date.localeCompare(a.date));
  const grouped={};
  sorted.forEach(t=>{if(!grouped[t.date])grouped[t.date]=[];grouped[t.date].push(t);});
  return Object.entries(grouped).map(([date,items])=>{
    const d=new Date(date+'T12:00:00');
    const lbl=DAYS[d.getDay()]+' '+d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    const rows=items.map(t=>{
      const cat=CATS.find(c=>c.name===t.cat)||CATS[7];
      const isInc=t.kind==='inc';
      return `<div class="dp-tx-item">
        <div class="dp-tx-ico" style="background:${cat.bg}">${cat.icon}</div>
        <div class="dp-tx-info"><div class="dp-tx-name">${esc(t.desc||t.cat)}${t.fixed?' <span class="fixed-badge">Fixe</span>':''}</div><div class="dp-tx-sub">${esc(t.cat)} · ${esc(t.who)}</div></div>
        <div class="dp-tx-amt" style="color:${isInc?'var(--green)':'var(--red)'}">${isInc?'+':'−'}${fmtS(Number(t.amount))} F</div>
      </div>`;
    }).join('');
    return `<div class="day-lbl-small">${lbl}</div>${rows}`;
  }).join('');
}

function clickMonthBar(i){
  const monthsList=window._statsMonths||[];
  if(selMonthBar===i){selMonthBar=null;openDepMonth=false;renderStats();return;}
  selMonthBar=i;openDepMonth=false;
  const m=monthsList[i];
  renderStats();
  const expList=m.list.filter(t=>t.kind!=='inc');
  const cats=buildCatStats(expList);
  const isCur=m.key===curMonthKey();
  const badge=isCur?`<div class="dp-badge mcur">En cours</div>`:m.end>=0?`<div class="dp-badge ok">Reste ${fmt(m.end)}</div>`:`<div class="dp-badge over">Découvert ${fmt(Math.abs(m.end))}</div>`;
  const legs=cats.map((c,idx)=>`<div class="ml-item"><div class="ml-dot" style="background:${CAT_COLORS[idx%CAT_COLORS.length]}"></div><div class="ml-name">${esc(c.name)}</div><div class="ml-val">${fmtS(c.val)} F</div></div>`).join('');
  const mName=monthLabel(m.key);
  const txHtml=renderTxList(m.list);
  const panel=document.getElementById('month-detail-panel');
  panel.innerHTML=`<div class="detail-panel month">
    <div class="dp-top">
      <div><div class="dp-title month">${mName} — ${fmt(m.spent)}</div><div class="dp-dates month">Départ ${fmt(m.start)} · ${m.list.length} opérations</div></div>
      ${badge}
    </div>
    <div class="dp-chart">${buildMiniDonut(cats,76,'month')}<div class="mini-legend">${legs}</div></div>
    <div class="dep-section">
      <div class="dep-header" onclick="toggleDepMonth()">
        <div class="dep-left"><div class="dep-title">Opérations</div><div class="dep-count">${m.list.length}</div></div>
        <div class="dep-arrow" id="dep-arrow-month">▼</div>
      </div>
      <div class="dep-list" id="dep-list-month">
        <div class="dep-list-inner">${txHtml}<div class="dep-total-row"><div class="dt-label">Solde final</div><div class="dt-val" style="color:${m.end<0?'var(--red)':'var(--green)'}">${fmt(m.end)}</div></div></div>
      </div>
    </div>
  </div>`;
  setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'nearest'}),100);
}

function toggleDepMonth(){
  openDepMonth=!openDepMonth;
  document.getElementById('dep-list-month').classList.toggle('open',openDepMonth);
  document.getElementById('dep-arrow-month').classList.toggle('open',openDepMonth);
}

// ─── EXCEL EXPORT ────────────────────────────────────────────
function exportExcel(){
  const key=curMonthKey();
  const led=computeLedger(key);
  const filename='budget_'+monthLabel(key).replace(' ','_')+'.xlsx';
  const rows=[['Date','Intitulé','Catégorie','Fixe','Montant FCFP','Total','Saisi par']];
  rows.push(['','Reste','','','',led.start,'']);
  led.list.forEach(t=>{
    rows.push([t.date,t.desc||t.cat,t.cat,t.fixed?'Oui':'',t.kind==='inc'?Number(t.amount):-Number(t.amount),t.runningAfter,t.who]);
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:12},{wch:28},{wch:15},{wch:8},{wch:14},{wch:14},{wch:15}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Budget');
  XLSX.writeFile(wb,filename);
}

// ─── HISTORY ─────────────────────────────────────────────────
function renderHistory(){
  const cur=curMonthKey();
  const past=Object.keys(months).filter(k=>k!==cur).sort((a,b)=>b.localeCompare(a)).map(k=>{
    const led=computeLedger(k);
    return {key:k,spent:led.totalExp,inc:led.totalInc,count:led.list.length,start:led.start,end:led.end};
  });
  const el=document.getElementById('hist-list');
  if(!past.length){el.innerHTML='<div class="empty-msg">Aucun historique pour l\'instant.</div>';return;}
  el.innerHTML=past.map(h=>{
    const color=h.end>=0?'var(--green)':'var(--red)';
    return `<div class="hist-item">
      <div><div class="hist-week">${monthLabel(h.key)}</div><div class="hist-dates">${h.count} opération${h.count>1?'s':''} · Départ ${fmtS(h.start)}</div></div>
      <div style="text-align:right"><div style="font-size:15px;font-weight:600;color:${color}">${fmt(h.end)}</div><div class="hist-pct">Dépensé ${fmtS(h.spent)}</div></div>
    </div>`;
  }).join('');
}

// ─── TABS ────────────────────────────────────────────────────
function switchTab(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');

  if(name==='home'){
    document.getElementById('header-title').innerHTML='Budget semaine <span class="sync-dot" id="sync-dot"></span>';
    render();
  } else if(name==='stats'){
    selMonthBar=null;openDepMonth=false;
    renderStats();
  } else if(name==='hist'){
    document.getElementById('header-title').innerHTML='Historique <span class="sync-dot" id="sync-dot"></span>';
    document.getElementById('header-extra').innerHTML='';
    renderHistory();
  }
}

// ─── EVENTS ──────────────────────────────────────────────────
document.getElementById('f-amount').addEventListener('keydown',e=>{if(e.key==='Enter')addTx();});
document.getElementById('f-desc').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('f-amount').focus();});
document.getElementById('setup-name').addEventListener('keydown',e=>{if(e.key==='Enter')saveName();});
document.getElementById('ft-amount').addEventListener('keydown',e=>{if(e.key==='Enter')addFixedTemplate();});
document.getElementById('f-date').value=isoToday();

init();
</script>
